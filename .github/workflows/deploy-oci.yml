name: Deploy to OCI

# Ships the `bcd` CLI to the OCI server so the operator can run the RFB
# ingest (download → extract → load) directly there. This workflow is NOT
# meant to deploy an HTTP API — the production API lives in brazildata/api
# and owns /opt/brazildata/{bin/api, data, etc.}. Everything here stays
# inside /home/ubuntu/ to avoid any path collision with that deploy.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oci
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy bcd CLI to OCI
    runs-on: ubuntu-latest
    env:
      OCI_SSH_HOST: ${{ vars.OCI_SSH_HOST }}
      OCI_SSH_USER: ${{ vars.OCI_SSH_USER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build bcd CLI for linux/arm64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p dist
          SHORT_SHA="${GITHUB_SHA::7}"
          go build -v -trimpath \
            -ldflags="-s -w -X github.com/addodelgrossi/bcd/cmd.Version=${SHORT_SHA}" \
            -o dist/bcd .
          cp schema.sql dist/
          (cd dist && sha256sum bcd schema.sql > SHA256SUMS)
          tar -czf release.tar.gz -C dist .
          ls -lh dist/ release.tar.gz
          file dist/bcd

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload release tarball
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            release.tar.gz \
            "${OCI_SSH_USER}@${OCI_SSH_HOST}:/tmp/bcd-${GITHUB_SHA}.tar.gz"

      - name: Activate release on server
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${OCI_SSH_USER}@${OCI_SSH_HOST}" \
            "SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail
          REL="$HOME/bcd/releases/${SHA}"
          TARBALL="/tmp/bcd-${SHA}.tar.gz"

          echo "==> Extracting to ${REL}"
          mkdir -p "${REL}"
          tar -xzf "${TARBALL}" -C "${REL}"
          chmod +x "${REL}/bcd"

          echo "==> Verifying checksums"
          (cd "${REL}" && sha256sum -c SHA256SUMS)

          echo "==> Atomic symlink swap (~/bin/bcd)"
          mkdir -p "$HOME/bin"
          ln -sfn "${REL}/bcd" "$HOME/bin/bcd.new"
          mv -Tf "$HOME/bin/bcd.new" "$HOME/bin/bcd"

          echo "==> bcd CLI smoke test"
          "$HOME/bin/bcd" --help >/dev/null 2>&1 || "$HOME/bin/bcd" help >/dev/null 2>&1 || true
          "$HOME/bin/bcd" --version 2>/dev/null || true

          echo "==> Cleaning up old releases (keeping last 3)"
          ls -1dt "$HOME/bcd/releases"/*/ 2>/dev/null | tail -n +4 | xargs -r rm -rf
          rm -f "${TARBALL}"

          echo "==> Deploy complete: ${SHA}"
          ls -la "$HOME/bin/bcd" "$HOME/bcd/releases"
          REMOTE

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
